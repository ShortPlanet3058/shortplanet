<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finn Vignon · ShortPlanet</title>
<meta name="description" content="Finn Vignon, computer science student at Epitech. Calm tools and strange worlds on a small planet you can walk around.">
<meta name="star-api" content="https://stars.theshortplanet.uk">
<meta property="og:type" content="website">
<meta property="og:url" content="https://theshortplanet.uk/">
<meta property="og:title" content="Finn Vignon · ShortPlanet">
<meta property="og:description" content="Calm tools and strange worlds on a small planet you can walk around. Light a star before you leave.">
<meta property="og:image" content="https://theshortplanet.uk/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Finn Vignon's name above a small planet in a starry night sky">
<meta name="twitter:card" content="summary_large_image">
<script>try { const t = localStorage.getItem("shortplanet-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}</script>
<meta name="theme-color" content="#bccbeb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#060919" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/young-serif-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/atkinson-hyperlegible-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app is-title" id="app">
  <canvas id="world" tabindex="0" data-i18n-aria="canvas"></canvas>
  <div class="grain" aria-hidden="true"></div>

  <header class="top" id="top">
    <div class="who">
      <span class="label" data-i18n="kicker"></span>
      <h1>Finn Vignon</h1>
      <p data-i18n="tagline"></p>
      <div class="ledger" id="ledger"></div>
    </div>
    <div class="side">
      <div class="actions">
        <button class="btn primary" id="starBtn" type="button"></button>
        <button class="btn" id="plainBtn" type="button" data-i18n="plain"></button>
        <button class="btn" id="modBtn" type="button" hidden data-i18n="moderate"></button>
      </div>
      <div class="starbar" id="starbar" hidden>
        <p id="starMsg"></p>
        <form id="starForm" hidden>
          <label for="starName"><span data-i18n="nameLabel"></span> <small data-i18n="optional"></small></label>
          <input id="starName" name="name" maxlength="24" autocomplete="given-name" data-i18n-ph="namePh" aria-describedby="starNote">
          <label for="starOrg"><span data-i18n="orgLabel"></span> <small data-i18n="optional"></small></label>
          <input id="starOrg" name="org" maxlength="40" autocomplete="organization" data-i18n-ph="orgPh" aria-describedby="starNote">
          <label for="starWord"><span data-i18n="wordLabel"></span> <small data-i18n="optional"></small></label>
          <input id="starWord" name="word" maxlength="32" autocomplete="off" data-i18n-ph="wordPh" aria-describedby="starNote">
          <small class="star-note" id="starNote" data-i18n="consent"></small>
          <div class="row">
            <button class="btn" type="button" id="starCancel2" data-i18n="cancel"></button>
            <button class="btn primary" type="submit" data-i18n="lightIt"></button>
          </div>
        </form>
        <div class="row" id="starRow">
          <button class="btn" type="button" id="starRemove" data-i18n="removeStar" hidden></button>
          <button class="btn" type="button" id="starCancel" data-i18n="cancel"></button>
        </div>
      </div>
    </div>
    <div class="prefs">
      <button class="theme" type="button" data-theme-toggle><svg viewBox="0 0 24 24" aria-hidden="true"><g class="auto"><circle cx="12" cy="12" r="7.5"/><path class="fill" d="M12 4.5a7.5 7.5 0 0 0 0 15z"/></g><g class="light"><circle cx="12" cy="12" r="3.8"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></g><path class="dark" d="M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5z"/></svg></button>
      <button class="sound" id="soundBtn" type="button" data-i18n-aria="sound" data-i18n-title="sound">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="spk" d="M4 9.5h3.2L12 5.5v13l-4.8-4H4z"/><path class="wave" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11"/><path class="mute" d="M16 9.5l5 5m0-5l-5 5"/></svg>
      </button>
      <div class="lang" role="group" aria-label="Language · Langue">
        <button type="button" data-lang="en" lang="en" aria-pressed="false">EN</button>
        <button type="button" data-lang="fr" lang="fr" aria-pressed="false">FR</button>
      </div>
    </div>
  </header>

  <section class="title" id="title" aria-labelledby="titleName">
    <span class="label" data-i18n="kicker"></span>
    <h1 id="titleName">Finn Vignon</h1>
    <p data-i18n="tagline"></p>
    <div class="ledger" id="titleLedger"></div>
    <button class="btn primary land" id="landBtn" type="button" data-i18n="land"></button>
    <p class="title-hint" data-i18n="titleHint"></p>
  </section>

  <aside class="card" id="card" aria-live="polite">
    <div class="card-head">
      <div class="nav">
        <button class="arrow" type="button" data-go="-1" data-i18n-aria="prev">←</button>
        <div class="dots" id="dots"></div>
        <button class="arrow" type="button" data-go="1" data-i18n-aria="next">→</button>
      </div>
    </div>
    <div class="card-body" id="cardBody"></div>
  </aside>
  <div class="dock" id="dock">
    <button class="btn leave" id="leaveBtn" type="button" data-i18n="leave"></button>
    <button class="btn zoom" id="zoomBtn" type="button" aria-pressed="false"></button>
    <p class="hint" data-i18n="hint"></p>
  </div>
  <div class="tip" id="tip" hidden></div>

  <dialog class="viewer" id="viewer" data-i18n-aria="viewer">
    <button class="arrow" type="button" id="viewerClose" data-i18n-aria="close">×</button>
    <figure><img id="viewerImg" alt=""><figcaption id="viewerCap" aria-hidden="true"></figcaption></figure>
  </dialog>

  <dialog class="mod" id="mod" aria-labelledby="modTitle">
    <div class="mod-head">
      <h2 id="modTitle" data-i18n="modTitle"></h2>
      <span class="mod-tools">
        <button class="btn" type="button" id="modForget" data-i18n="forget" hidden></button>
        <button class="arrow" type="button" id="modClose" data-i18n-aria="close">×</button>
      </span>
    </div>
    <p class="mod-note" data-i18n="modNote"></p>
    <form class="mod-key" id="modKey">
      <label for="modKeyInput" data-i18n="adminKey"></label>
      <div class="row"><input id="modKeyInput" type="password" autocomplete="current-password" required><button class="btn primary" type="submit" data-i18n="open"></button></div>
      <p id="modKeyMsg" role="alert"></p>
    </form>
    <div id="modList" hidden></div>
  </dialog>
</div>

<main class="plain" id="plain" hidden></main>

<script type="module" src="js/app.js"></script>
</body>
</html>
