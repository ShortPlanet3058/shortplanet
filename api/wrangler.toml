name = "shortplanet-stars"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "shortplanet-stars"
database_id = "00000000-0000-0000-0000-000000000000"   # replace with the id printed by: npx wrangler d1 create shortplanet-stars

[vars]
ALLOWED_ORIGINS = "https://theshortplanet.uk,https://www.theshortplanet.uk,http://localhost:8765,http://127.0.0.1:8765"

# Secrets, set once with `npx wrangler secret put <NAME>` (and in .dev.vars for local runs):
#   ADMIN_KEY   the key you type into the site's #admin panel
#   HASH_SALT   any long random string; salts the hashed IP addresses used for rate limiting
