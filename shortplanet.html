<title>ShortPlanet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one screen. A small planet you walk around by dragging; the place on top wakes up and
   opens in a card (right side on wide screens, bottom sheet on phones). Light = dawn, dark = night. */
:root {
  --sky-top: #bccbeb;
  --sky-bottom: #f7d9c6;
  --planet: #6a5a7c;
  --planet-shade: #4f4264;
  --rim: #fff1e6;
  --glow: #d4732a;
  --door-b: #8a5cc7;
  --door-c: #2c8a85;
  --signal: #c2413b;
  --void: #0c0a12;
  --walker: #2b2238;
  --star: #3b3157;
  --star-alpha: .28;
  --cloud-alpha: .5;
  --wall: #7c6b92;
  --roof: #4c3f61;
  --ink: #231b31;
  --ink-soft: #57496b;
  --paper: rgba(255, 250, 246, .86);
  --paper-solid: #fbf4f0;
  --line: rgba(35, 27, 49, .14);
  --btn: rgba(255, 250, 246, .6);
  --focus: #8a5cc7;
  --f-display: "Young Serif", Georgia, "Times New Roman", serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky-top: #060919; --sky-bottom: #1d1739; --planet: #3b304f; --planet-shade: #261e37;
    --rim: #9b88c9; --glow: #f2b866; --door-b: #b48eff; --door-c: #6fd6c9; --signal: #ff7a6e;
    --void: #050409; --walker: #ece4f7;
    --star: #fff5e4; --star-alpha: .9; --cloud-alpha: .09; --wall: #4d4166; --roof: #261e37; --ink: #f1ebf8; --ink-soft: #b5a9c8;
    --paper: rgba(17, 13, 33, .8); --paper-solid: #161127; --line: rgba(241, 235, 248, .14); --btn: rgba(17, 13, 33, .55);
    --focus: #f2b866; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky-top: #060919; --sky-bottom: #1d1739; --planet: #3b304f; --planet-shade: #261e37;
  --rim: #9b88c9; --glow: #f2b866; --door-b: #b48eff; --door-c: #6fd6c9; --signal: #ff7a6e;
  --void: #050409; --walker: #ece4f7;
  --star: #fff5e4; --star-alpha: .9; --cloud-alpha: .09; --wall: #4d4166; --roof: #261e37; --ink: #f1ebf8; --ink-soft: #b5a9c8;
  --paper: rgba(17, 13, 33, .8); --paper-solid: #161127; --line: rgba(241, 235, 248, .14); --btn: rgba(17, 13, 33, .55);
  --focus: #f2b866; color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
  background-color: var(--sky-top);
  color: var(--ink);
  font: 16px/1.55 var(--f-body);
  overflow: hidden;
}
body.is-plain { overflow: auto; }
a { color: inherit; text-decoration-color: color-mix(in srgb, var(--glow) 70%, transparent); text-underline-offset: 3px; text-decoration-thickness: 1.5px; }
a:hover { text-decoration-color: var(--glow); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 6px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font-family: var(--f-mono); font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-soft); }

/* ---------- planet view ---------- */
.app { position: relative; height: 100%; overflow: hidden; }
#world { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; display: block; }
#world.dragging { cursor: grabbing; }
#world.placing { cursor: crosshair; }
#world.over-place { cursor: pointer; }

.top {
  position: absolute; left: 0; right: 0; top: 0; z-index: 2;
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px 24px;
  padding: 20px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
  pointer-events: none;
}
.top > * { pointer-events: auto; }
.who { display: grid; gap: 4px; max-width: 34rem; min-width: 0; }
.who h1 { margin: 0; font: 400 clamp(26px, 3.4vw, 36px)/1.05 var(--f-display); letter-spacing: -.01em; }
.who p { margin: 0; color: var(--ink-soft); font-size: 15px; text-wrap: balance; }
.ledger { font-size: 12.5px; color: var(--ink-soft); display: flex; gap: 8px; align-items: center; }
.ledger::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--glow); box-shadow: 0 0 10px var(--glow); flex: none; }

.side { position: relative; display: grid; gap: 10px; justify-items: end; margin-left: auto; }
.lang {
  display: inline-flex; gap: 2px; padding: 3px; flex: none; border: 1px solid var(--line); border-radius: 999px; background: var(--btn);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.top > .lang { margin-left: -12px; }
@media (min-width: 860px) { .top { flex-wrap: nowrap; } .who { flex: 1 1 auto; } }
.lang button {
  appearance: none; border: 0; background: transparent; color: var(--ink-soft); cursor: pointer;
  font: 500 12px/1 var(--f-mono); letter-spacing: .06em; padding: 8px 9px; border-radius: 999px;
}
.lang button:hover { color: var(--ink); }
.lang button[aria-pressed="true"] { background: color-mix(in srgb, var(--glow) 24%, transparent); color: var(--ink); }
.plain-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
button { font: inherit; color: inherit; }
.btn {
  appearance: none; border: 1px solid var(--line); background: var(--btn); color: var(--ink);
  padding: 8px 14px; border-radius: 999px; font-size: 14px; cursor: pointer;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.btn:hover { border-color: color-mix(in srgb, var(--glow) 60%, var(--line)); }
.btn.primary { border-color: color-mix(in srgb, var(--glow) 55%, transparent); }
.btn.primary::before { content: "✦ "; color: var(--glow); }

.starbar {
  position: absolute; top: calc(100% + 10px); right: 0; box-sizing: border-box;
  width: min(360px, calc(100vw - 32px)); padding: 12px 14px; border-radius: 14px;
  background: var(--paper); border: 1px solid var(--line);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  display: grid; gap: 10px; font-size: 14px;
}
.starbar p { margin: 0; }
.starbar form { display: grid; gap: 8px; }
.starbar label { font-size: 13px; color: var(--ink-soft); }
.starbar input {
  font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line);
  border-radius: 8px; padding: 7px 10px; width: 100%; box-sizing: border-box;
}
.starbar .row { display: flex; gap: 8px; justify-content: flex-end; }
.starbar .star-note { font-size: 12.5px; color: var(--ink-soft); }
.starbar form { gap: 6px; }
.starbar label small { color: var(--ink-soft); font-size: 12px; }
.starbar label:not(:first-child) { margin-top: 4px; }
.starbar input[aria-invalid="true"] { border-color: var(--signal); }

/* ---------- moderation (owner only) ---------- */
.mod {
  width: min(520px, calc(100% - 32px)); max-height: min(80vh, 680px); box-sizing: border-box; padding: 0;
  border: 1px solid var(--line); border-radius: 18px; background: var(--paper-solid); color: var(--ink);
  box-shadow: 0 24px 60px -24px rgba(10, 6, 24, .55);
}
.mod::backdrop { background: rgba(10, 6, 24, .45); }
.mod-head {
  position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 16px 18px 12px; background: var(--paper-solid); border-bottom: 1px solid var(--line);
}
.mod-head h2 { margin: 0; font: 400 22px/1.2 var(--f-display); }
.mod-head .arrow { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: transparent; cursor: pointer; font-size: 18px; line-height: 1; }
.mod-note { margin: 12px 18px 0; font-size: 14px; color: var(--ink-soft); }
#modList { padding: 4px 18px 20px; display: grid; gap: 14px; }
#modList h3 { margin: 12px 0 4px; }
#modList ul { list-style: none; margin: 0; padding: 0; display: grid; }
#modList li { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 14px; padding: 10px 0; border-top: 1px solid var(--line); }
.mod-word { display: grid; gap: 2px; min-width: 0; overflow-wrap: anywhere; font-size: 15.5px; }
.mod-word small { font-size: 12px; color: var(--ink-soft); }
.mod-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.mod-actions button {
  border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px;
  padding: 5px 12px; font-size: 13px; cursor: pointer;
}
.mod-actions button:hover { border-color: var(--glow); }
.mod-actions [data-mod="approve"] { border-color: color-mix(in srgb, var(--glow) 55%, transparent); }
.mod-actions [data-sure] { border-color: var(--signal); color: var(--signal); }
.mod-empty { margin: 12px 0 0; color: var(--ink-soft); font-size: 14px; }

.card {
  position: absolute; z-index: 2; box-sizing: border-box;
  right: max(16px, env(safe-area-inset-right, 0px)); top: 50%; transform: translateY(-46%);
  width: min(400px, 38vw); max-height: calc(100% - 200px); overflow: auto;
  border-radius: 18px;
  background: var(--paper); border: 1px solid var(--line);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 18px 50px -24px rgba(10, 6, 24, .45);
}
.card-head {
  position: sticky; top: 0; z-index: 1;
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 14px 18px 10px; background: var(--paper-solid);
  border-bottom: 1px solid var(--line);
}
.card-head .label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav { display: flex; gap: 4px; align-items: center; flex: none; }
.nav .arrow {
  width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: transparent;
  cursor: pointer; font-size: 15px; line-height: 1; flex: none;
}
.nav .arrow:hover { border-color: var(--glow); }
.dots { display: flex; gap: 2px; padding: 0 4px; }
.dots button {
  width: 18px; height: 22px; padding: 0; border: 0; background: transparent; cursor: pointer;
  display: grid; place-items: center;
}
.dots button::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--line); transition: background .2s, box-shadow .2s, transform .2s; }
.dots button:hover::before { background: var(--ink-soft); }
.dots button[aria-current="true"]::before { background: var(--glow); box-shadow: 0 0 8px var(--glow); transform: scale(1.25); }

.card-body { padding: 14px 20px 22px; display: grid; gap: 14px; }
.card-body.swap { animation: swap .45s ease both; }
@keyframes swap { from { opacity: .25; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.place-name { margin: 0; font: 400 25px/1.15 var(--f-display); text-wrap: balance; }
.onplanet { margin: -6px 0 0; font-size: 14px; color: var(--ink-soft); }
.ask { margin: 2px 0; padding: 12px 14px; border-radius: 12px; display: grid; gap: 4px;
  background: color-mix(in srgb, var(--glow) 9%, transparent); }
.ask p { margin: 0; font: 400 18px/1.35 var(--f-display); text-wrap: balance; }
.projects { display: grid; gap: 18px; margin-top: 4px; }
.proj { display: grid; gap: 6px; min-width: 0; }
.proj + .proj { padding-top: 16px; border-top: 1px solid var(--line); }
.proj h3 { margin: 0; font-size: 18px; font-weight: 700; }
.proj p { margin: 0; font-size: 15px; }
.proj .tagline { font-style: italic; color: var(--ink-soft); }
.proj .meta { font-size: 12px; color: var(--ink-soft); }
.links { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14px; }
.mods { list-style: none; margin: 4px 0 0; padding: 0; display: grid; font-size: 14px; }
.mods li { display: grid; grid-template-columns: 1fr auto; gap: 14px; padding: 10px 0; border-top: 1px solid var(--line); }
.mod-text { min-width: 0; display: grid; gap: 2px; }
.mod-text strong { font-weight: 700; }
.mods .mod-text p { margin: 0; font-size: 13.5px; line-height: 1.45; color: var(--ink-soft); }
.mods .dl { font-family: var(--f-mono); font-size: 12.5px; color: var(--ink); text-align: right; display: grid; align-content: start; gap: 2px; }
.mods .dl small { font-size: 10.5px; letter-spacing: .04em; color: var(--ink-soft); max-width: 10.5ch; justify-self: end; line-height: 1.3; }
.copyrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }
.copyrow code { font-family: var(--f-mono); font-size: 13px; user-select: all; }
.copyrow button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 2px 10px; font-size: 12.5px; cursor: pointer; }

.dock {
  position: absolute; z-index: 2; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 14px;
}
.btn.zoom { font-size: 13px; padding: 6px 12px 6px 10px; display: inline-flex; align-items: center; gap: 7px; }
.btn.zoom::before {
  content: ""; width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid currentColor; flex: none;
  background: radial-gradient(circle at 50% 50%, var(--glow) 0 2px, transparent 2.5px);
}
.btn.zoom[aria-pressed="true"]::before { background: var(--glow); border-color: var(--glow); }
.btn.leave { font-size: 13px; padding: 6px 12px 6px 10px; }
.btn.leave::before { content: "↑ "; color: var(--glow); font-weight: 700; }
.dock { flex-wrap: wrap; gap: 8px 14px; }
.hint { margin: 0; font-size: 12.5px; color: var(--ink-soft); pointer-events: none; }
/* ---------- title screen and landing ----------
   .is-title: the front page, the planet far away under the name. .is-landing: the rocket is coming down,
   everything but the sky is hidden until the walker steps out. */
.title {
  position: absolute; z-index: 2; left: 50%; top: clamp(76px, 15vh, 150px); translate: -50% 0;
  width: min(560px, calc(100% - 32px)); text-align: center; display: grid; justify-items: center; gap: 10px;
  pointer-events: none; transition: opacity .6s ease, translate .6s ease, visibility 0s;
}
.title .btn { pointer-events: auto; }
.title h1 { margin: 0; font: 400 clamp(42px, 7vw, 70px)/1 var(--f-display); letter-spacing: -.015em; }
.title p { margin: 0; color: var(--ink-soft); font-size: 17px; text-wrap: balance; }
.title .ledger { justify-content: center; }
.btn.land { margin-top: 12px; font-size: 16px; padding: 12px 24px; }
.title .title-hint { font-size: 13px; }
.app:not(.is-title) .title { opacity: 0; visibility: hidden; translate: -50% -18px; transition: opacity .35s ease, translate .5s ease, visibility 0s .5s; }
.app.is-title .who { display: none; }
.app.no-fade :is(.title, .card, .dock, .top) { transition: none !important; }
.card, .dock, .top { transition: opacity .7s ease, visibility 0s; }
.app:is(.is-title, .is-landing) :is(.card, .dock), .app.is-landing .top {
  opacity: 0; visibility: hidden; transition: opacity .3s ease, visibility 0s .3s;
}
.tip {
  position: absolute; z-index: 3; pointer-events: none; transform: translate(-50%, calc(-100% - 10px));
  background: var(--paper); border: 1px solid var(--line); border-radius: 10px;
  padding: 5px 10px; font-size: 13.5px; width: max-content; max-width: 260px; text-align: center;
}

@media (max-width: 859px) {
  .top { padding-top: 14px; }
  .who p { font-size: 14px; }
  .side { justify-items: start; width: 100%; }
  .actions { justify-content: flex-start; }
  .starbar { right: auto; left: 0; }
  .card {
    left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
    top: auto; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); transform: none;
    width: auto; height: min(40%, 400px); max-height: none;
  }
  .card { transition: translate .5s cubic-bezier(.3, .7, .2, 1), opacity .7s ease, visibility 0s; }
  .title { top: 96px; }
  .title p { font-size: 15.5px; }
  .app.is-far .card { translate: 0 calc(100% - 54px); }
  .dock { left: auto; right: max(12px, env(safe-area-inset-right, 0px)); bottom: auto; flex-direction: column; align-items: flex-end; gap: 6px; }
  .who > .label { display: none; }
  .top > .lang { position: absolute; top: 12px; right: max(12px, env(safe-area-inset-right, 0px)); margin: 0; }
  .card-head { padding: 10px 12px 8px 16px; }
  .card-body { padding: 12px 16px 18px; gap: 12px; }
  .place-name { font-size: 22px; }
  .ask p { font-size: 16.5px; }
  .dots button { width: 15px; }
  .hint { display: none; }
}

/* ---------- plain view ---------- */
.plain {
  min-height: 100%; box-sizing: border-box;
  padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--sky-top) 30%, var(--paper));
}
.plain-inner { max-width: 44rem; margin: 0 auto; display: grid; gap: 36px; }
.plain-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
.plain h1 { margin: 0; font: 400 clamp(30px, 5vw, 42px)/1.1 var(--f-display); }
.plain .lede { margin: 8px 0 0; font-size: 17px; max-width: 36rem; color: var(--ink-soft); }
.plain h2 { margin: 0 0 6px; font: 400 22px/1.2 var(--f-display); }
.plain section { display: grid; gap: 14px; }
.plain .proj { padding-top: 14px; border-top: 1px solid var(--line); }

@media (prefers-reduced-motion: reduce) {
  .card-body.swap { animation: none; }
  .card, .top, .dock, .title { transition: none !important; }
}
</style>

<div class="app is-title" id="app">
  <canvas id="world" tabindex="0" data-i18n-aria="canvas"></canvas>

  <header class="top" id="top">
    <div class="who">
      <span class="label" data-i18n="kicker"></span>
      <h1>Finn Vignon</h1>
      <p data-i18n="tagline"></p>
      <div class="ledger" id="ledger"></div>
    </div>
    <div class="side">
      <div class="actions">
        <button class="btn primary" id="starBtn" type="button"></button>
        <button class="btn" id="plainBtn" type="button" data-i18n="plain"></button>
        <button class="btn" id="modBtn" type="button" hidden data-i18n="moderate"></button>
      </div>
      <div class="starbar" id="starbar" hidden>
        <p id="starMsg"></p>
        <form id="starForm" hidden>
          <label for="starName"><span data-i18n="nameLabel"></span> <small data-i18n="optional"></small></label>
          <input id="starName" name="name" maxlength="24" autocomplete="given-name" data-i18n-ph="namePh" aria-describedby="starNote">
          <label for="starOrg"><span data-i18n="orgLabel"></span> <small data-i18n="optional"></small></label>
          <input id="starOrg" name="org" maxlength="40" autocomplete="organization" data-i18n-ph="orgPh" aria-describedby="starNote">
          <label for="starWord"><span data-i18n="wordLabel"></span> <small data-i18n="optional"></small></label>
          <input id="starWord" name="word" maxlength="32" autocomplete="off" data-i18n-ph="wordPh" aria-describedby="starNote">
          <small class="star-note" id="starNote" data-i18n="consent"></small>
          <div class="row">
            <button class="btn" type="button" id="starCancel2" data-i18n="cancel"></button>
            <button class="btn primary" type="submit" data-i18n="lightIt"></button>
          </div>
        </form>
        <div class="row" id="starRow">
          <button class="btn" type="button" id="starRemove" data-i18n="removeStar" hidden></button>
          <button class="btn" type="button" id="starCancel" data-i18n="cancel"></button>
        </div>
      </div>
    </div>
    <div class="lang" role="group" aria-label="Language · Langue">
      <button type="button" data-lang="en" lang="en" aria-pressed="false">EN</button>
      <button type="button" data-lang="fr" lang="fr" aria-pressed="false">FR</button>
    </div>
  </header>

  <section class="title" id="title" aria-labelledby="titleName">
    <span class="label" data-i18n="kicker"></span>
    <h1 id="titleName">Finn Vignon</h1>
    <p data-i18n="tagline"></p>
    <div class="ledger" id="titleLedger"></div>
    <button class="btn primary land" id="landBtn" type="button" data-i18n="land"></button>
    <p class="title-hint" data-i18n="titleHint"></p>
  </section>

  <aside class="card" id="card" aria-live="polite">
    <div class="card-head">
      <span class="label" id="lon">000°</span>
      <div class="nav">
        <button class="arrow" type="button" data-go="-1" data-i18n-aria="prev">←</button>
        <div class="dots" id="dots"></div>
        <button class="arrow" type="button" data-go="1" data-i18n-aria="next">→</button>
      </div>
    </div>
    <div class="card-body" id="cardBody"></div>
  </aside>
  <div class="dock" id="dock">
    <button class="btn leave" id="leaveBtn" type="button" data-i18n="leave"></button>
    <button class="btn zoom" id="zoomBtn" type="button" aria-pressed="false"></button>
    <p class="hint" data-i18n="hint"></p>
  </div>
  <div class="tip" id="tip" hidden></div>

  <dialog class="mod" id="mod" aria-labelledby="modTitle">

  const TT = { walk: .55, board: 1.3, ignite: 1.35, lift: 1.9, gone: 3.6 };
  let takeT = 0;
  function startTakeoff() {
    if (mode !== "surface") return;
    if (placing) stopPlacing();
    setView(false);
    mode = "takeoff"; takeT = 0; tip.hidden = true; dragging = false; walkerWas = WALK_ANGLE;
    canvas.classList.remove("dragging", "over-place");
    rot0 = mod(rot + Math.PI, Math.PI * 2) - Math.PI; rot = prevRot = target = rot0;
    app.classList.add("is-landing");

  function finishTakeoff() {

  $("leaveBtn").addEventListener("click", startTakeoff);
  // the rocket once it has left the ground, in the world frame

    const ang = rot + LAND_ANGLE + .8 * s * s;
    return { x: Math.sin(ang) * (R + alt * U), y: -Math.cos(ang) * (R + alt * U), ang: ang + .6 * s,
      flame: 1, legs: 1 - smooth(s / .12), alt };
  }
  const parkedFlame = () => (mode === "takeoff" ? .9 * smooth((takeT - TT.ignite) / .45) : 0);

  // where the rocket is at landing time tl, in the world frame
  function rocketAt(tl) {
    const site = rot + LAND_ANGLE, ux = Math.sin(site), uy = -Math.cos(site);
    if (tl < LT.flip) {
      const x = clamp01((tl - LT.start) / (LT.flip - LT.start)), p = 1 - Math.pow(1 - x, 2.4);
      const P0 = [7 * R, -5.6 * R], C = [1.6 * R, -3.4 * R], P2 = [ux * (R + 4 * U), uy * (R + 4 * U)];
      const b = (i) => (1 - p) ** 2 * P0[i] + 2 * p * (1 - p) * C[i] + p * p * P2[i];
      const v = (i) => 2 * (1 - p) * (C[i] - P0[i]) + 2 * p * (P2[i] - C[i]);
      const flip = smooth((x - .6) / .35);
      return { x: b(0), y: b(1), ang: turnTo(Math.atan2(v(0), -v(1)), site, flip),
        flame: Math.max(x < .45 ? 1 - x * .6 : 0, flip * .9), legs: 0, alt: 9 };
    }
    const q = clamp01((tl - LT.flip) / (LT.touch - LT.flip)), alt = 4 - (4 - ROCKET * .5) * smooth(q);
    return { x: ux * (R + alt * U), y: uy * (R + alt * U), ang: site, flame: q < 1 ? .9 - .5 * smooth(q) : 0,
      legs: smooth((q - .1) / .5), alt };
  }

  // drawn nose up with the nozzle at y = 0 and the feet at y = .5 once the legs are out (unit: U * ROCKET)
  function drawRocket(flame, legs, door, t) {
    if (flame > .01) {
      const f = flame * (still() ? 1 : .85 + .15 * Math.sin(t * 47) + .05 * Math.sin(t * 31));
      halo(0, .5, 1.4 + f * 1.4, T.glow, .55 * flame);
      lit(T.glow, .95, () => { ctx.beginPath(); ctx.moveTo(-.36, -.05); ctx.quadraticCurveTo(-.3, .9 * f, 0, 1 + 2.4 * f); ctx.quadraticCurveTo(.3, .9 * f, .36, -.05); ctx.fill(); });
      lit(T.rim, .9, () => { ctx.beginPath(); ctx.moveTo(-.18, -.05); ctx.quadraticCurveTo(-.14, .5 * f, 0, .45 + 1.3 * f); ctx.quadraticCurveTo(.14, .5 * f, .18, -.05); ctx.fill(); });
    }
    const lx = .5 + .6 * legs, ly = .5 * legs;
    segs([[-.45, -1, -lx, ly], [.45, -1, lx, ly]], T.roof, .12);
    ctx.fillStyle = T.roof; rect(-lx - .2, ly - .06, .4, .1); rect(lx - .2, ly - .06, .4, .1);
    poly([-.58, -1.55, -1.05, -.5, -1, -.05, -.58, -.6]); poly([.58, -1.55, 1.05, -.5, 1, -.05, .58, -.6]);
    poly([-.32, -.5, .32, -.5, .42, 0, -.42, 0]);
    // body, with a painted nose and band, shaded on the right
    ctx.fillStyle = T.wall; ctx.beginPath();
    ctx.moveTo(0, -3.7); ctx.bezierCurveTo(.55, -3.3, .68, -2.5, .62, -1.4); ctx.lineTo(.55, -.45);
    ctx.lineTo(-.55, -.45); ctx.lineTo(-.62, -1.4); ctx.bezierCurveTo(-.68, -2.5, -.55, -3.3, 0, -3.7); ctx.fill();
    ctx.save(); ctx.clip();
    lit(T.signal, .9, () => { rect(-.8, -3.8, 1.6, .62); rect(-.8, -1.42, 1.6, .16); });
    lit(T.roof, .35, () => rect(.22, -3.8, .7, 3.4));
    ctx.restore();
    segs([[-.6, -2.9, -.62, -1.5]], T.rim, .05, .4);
    ctx.fillStyle = T.roof; circle(0, -2.35, .3);
    lit(T.glow, .85, () => circle(0, -2.35, .2));
    ctx.fillStyle = T.roof; rect(-.24, -1.2, .48, .66);
    if (door > 0) { halo(0, -.87, 1, T.glow, .4 * door); lit(T.glow, door, () => rect(-.18, -1.15, .36, .58)); }
  }

  // dust thrown sideways along the ground, then a little smoke rising after touchdown (site frame, unit U)
  function updatePuffs(dt, r) {
    if ((mode === "landing" || mode === "takeoff") && dt && !still()) {
      const near = r.alt < 3 && r.flame > .05 ? (1 - r.alt / 3) : 0, after = mode === "landing" && landT > LT.touch && landT < LT.touch + 1.2;
      for (let n = dt * (near * 70 + (after ? 12 : 0)); n > 0; n--) {
        if (n < 1 && Math.random() > n) break;
        const side = Math.random() < .5 ? -1 : 1;
        puffs.push(after && !near
          ? { x: (Math.random() - .5) * .5, y: -.2, vx: (Math.random() - .5) * .4, vy: -.6 - Math.random() * .5, age: 0, life: 1.4 + Math.random(), r: .25 }
          : { x: side * (.3 + Math.random() * .5), y: -.15, vx: side * (2 + Math.random() * 3), vy: -Math.random() * .7, age: 0, life: .8 + Math.random() * .7, r: .2 + Math.random() * .3 });
      }
    }
    for (let i = puffs.length - 1; i >= 0; i--) {
      const p = puffs[i]; p.age += dt; if (p.age > p.life) { puffs.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= Math.pow(.15, dt);
    }
  }
  function drawPuffs() {
    for (const p of puffs) { const k = p.age / p.life; lit(T.rim, .3 * (1 - k), () => circle(p.x, p.y, p.r + k * .8)); }
  }

  /* ---------- frame ---------- */
  let last = performance.now(), shoot = null, nextShoot = 6;
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;

        landT += dt;

        if (landT >= LT.out) app.classList.remove("is-landing");
        if (landT >= LT.end) finishLanding();
      } else if (mode === "takeoff") {

        takeT += dt;
        rot = target = rot0 * (1 - smooth(takeT / 1));

      } else if (!dragging) {
        if (mode === "title" && !still()) target -= dt * .06;   // the front page planet turns slowly
        const k = 1 - Math.pow(.004, dt);
        rot += (target - rot) * k;
        if (Math.abs(target - rot) < 1e-4) rot = target;
      }
      renderCard(focus());
      draw(now / 1000, dt);
    }
    requestAnimationFrame(frame);
  }

  function draw(t, dt) {
    const dRot = rot - prevRot; prevRot = rot;
    const sel = focus();
    const ease = still() ? 1 : 1 - Math.pow(.02, dt);
    awake.forEach((v, i) => { awake[i] = dt ? v + ((i === sel ? 1 : 0) - v) * ease : v; });

    // camera: the front page sits far out, the landing dives in, and on the surface it rises while you

    const rocket = mode === "landing" ? rocketAt(landT) : mode === "takeoff" ? rocketUp(takeT) : null;
    if (dt) {
      if (mode === "landing") z = still() ? 0 : 2 * (1 - smooth((landT - .35) / 3.25));

      else {

        const zt = mode === "title" ? 2 : Math.max(zView || placing ? 1 : 0, dragging && moved ? .35 : 0, travel);

    for (const s of SKY) {

      ctx.globalAlpha = T.starAlpha * tw * (.35 + s.r / 2);

      const [x, y] = starPos(s), mine = s.mine || (myId && s.id === myId);

      }

    for (const p of PEBBLES) { const d = R - p.d * U; circle(Math.sin(p.a) * d, -Math.cos(p.a) * d, p.r * U); }

    ctx.globalAlpha = 1;

    for (let i = 0; i < N; i++) {
      ctx.save(); ctx.rotate((i + .34) * STEP); ctx.translate(0, -R + U * .12); ctx.scale(U, U); tree(i % 2 ? .95 : 1.2); ctx.restore();
      ctx.save(); ctx.rotate((i + .7) * STEP); ctx.translate(0, -R + U * .12); ctx.scale(U, U); tufts(); ctx.restore();
    }
    // buildings lean against the turn and pop a little as they wake
    PLACES.forEach((p, i) => {
      const a = awake[i], pop = still() || i !== sel ? 1 : 1 + .06 * Math.sin(Math.PI * a);
      ctx.save(); ctx.rotate(i * STEP); ctx.translate(0, -R + U * .15);
      ctx.save(); ctx.scale(U, U); groundLabel(PL[i].name, a); ctx.restore();
      ctx.scale(U * pop, U * pop);
      lit(T["planet-shade"], .5, () => { ctx.beginPath(); ctx.ellipse(0, .04, 2.9, .2, 0, 0, Math.PI * 2); ctx.fill(); });
      ctx.transform(1, 0, lean, 1, 0, 0);
      DRAW[p.key](a, t);
      ctx.restore();
    });
    // once down, the rocket stays parked beside Home, and its dust settles there
    const down = (landed && !(mode === "takeoff" && takeT >= TT.lift)) || (mode === "landing" && landT >= LT.touch);
    ctx.save(); ctx.rotate(LAND_ANGLE); ctx.translate(0, -R);
    if (down) {
      const door = mode === "landing" ? smooth((landT - LT.touch - .2) / .3)
        : mode === "takeoff" ? (takeT < TT.board ? .35 + .65 * smooth((takeT - TT.walk) / .3) : 1 - smooth((takeT - TT.board) / .25)) : .35;
      ctx.save(); ctx.translate(0, -ROCKET * U * .5); ctx.scale(ROCKET * U, ROCKET * U);

    ctx.restore();

    if (rocket && !down && (mode === "takeoff" || landT > LT.start)) {
      ctx.save(); ctx.translate(rocket.x, rocket.y); ctx.rotate(rocket.ang); ctx.scale(ROCKET * U, ROCKET * U);

    if (mode === "surface") drawWalker(t, dRot);
    else if (mode === "landing" && landT > LT.out) {

      const k = smooth((landT - LT.out) / (LT.end - LT.out)), ang = LAND_ANGLE + (WALK_ANGLE - LAND_ANGLE) * k;

      const k = smooth((takeT - TT.walk) / (TT.board - TT.walk)), ang = WALK_ANGLE + (LAND_ANGLE - WALK_ANGLE) * k;
      drawWalker(t, walkerWas - ang, ang, clamp01((TT.board - takeT) / .15)); walkerWas = ang;
    }
    ctx.restore();
    drawWalkHint();
  }

  /* ---------- input ---------- */
  let startX = 0, startY = 0, lastX = 0, lastT = 0, moved = false;
  canvas.addEventListener("pointerdown", (e) => {
    startX = lastX = e.clientX; startY = e.clientY; lastT = performance.now(); moved = false; vel = 0;
    if (mode === "landing" || mode === "takeoff") {   // a click during the landing or takeoff skips it

    }
    if (placing) return;

  });
  canvas.addEventListener("pointermove", (e) => {
    if (dragging) {
      const dx = e.clientX - lastX, now = performance.now();
      if (Math.abs(e.clientX - startX) + Math.abs(e.clientY - startY) > 5) { moved = true; if (mode === "surface") walked(); }
      rot += dx / (R * cam.s); vel = dx / (R * cam.s) / Math.max(8, now - lastT) * 16;

  });
  function endDrag() {
    if (!dragging) return;

    if (still()) rot = target;
  }
  canvas.addEventListener("pointerup", (e) => {
    const wasMoved = moved; endDrag();
    if (!wasMoved) clickAt(e);
  });
  canvas.addEventListener("pointercancel", endDrag);
  canvas.addEventListener("pointerleave", () => { if (!dragging) { tip.hidden = true; canvas.classList.remove("over-place"); } });

  function local(e) { const a = canvas.getBoundingClientRect(); return [e.clientX - a.left, e.clientY - a.top]; }
  function starAt(x, y) {
    const all = myLocal ? [...stars, myLocal] : stars;
    let best = null, bd = 18 * 18;
    for (const s of all) { const [sx, sy] = starPos(s), d = (sx - x) ** 2 + (sy - y) ** 2; if (d < bd) { bd = d; best = s; } }
    return best;
  }
  function placeAt(x, y) {
    for (let i = 0; i < N; i++) {
      const [px, py] = placePos(i, U * 2.4);
      if (Math.hypot(px - x, py - y) < U * 3.2 * cam.s) return i;
    }
    return -1;
  }
  function showTip(text, x, y) {
    if (!text) { tip.hidden = true; return; }
    tip.textContent = text; tip.style.left = x + "px"; tip.style.top = y + "px"; tip.hidden = false;
  }
  // what a star says on hover: "“hello from Lyon” — Léa · Capgemini"; only entries that pass the checker and
  // are not hidden by the owner show their text, except to the visitor who wrote it
  function entryText(s) {
    const who = [s.name, s.org].filter(Boolean).join(" · ");
    const msg = s.word ? (lang === "fr" ? `«${NB}${s.word}${NB}»` : `“${s.word}”`) : "";
    return [msg, who].filter(Boolean).join(" — ");
  }
  function starText(s) {
    if (s === myLocal || s.mine || (myId && s.id === myId)) return !hasText(s) ? t("yourStar") : isHidden(s) ? t("yourHidden") : entryText(s);
    return hasText(s) && !check(s) && !isHidden(s) ? entryText(s) : t("wordless");
  }
  function hover(e) {
    const [x, y] = local(e);
    const s = starAt(x, y);
    if (s) { canvas.classList.remove("over-place"); return showTip(starText(s), ...starPos(s)); }
    if (mode === "title") {
      const onPlanet = !placing && Math.hypot(x - cam.x, y - cam.y) < R * cam.s * 1.25;
      canvas.classList.toggle("over-place", onPlanet);
      return onPlanet ? showTip(t("land"), cam.x, cam.y - R * cam.s * 1.3) : showTip(null);
    }
    const i = placing || mode !== "surface" ? -1 : placeAt(x, y);
    canvas.classList.toggle("over-place", i >= 0);
    if (i >= 0) { const [px, py] = placePos(i, U * 6.2); return showTip(`${PL[i].name} · ${PL[i].short}`, px, py); }
    showTip(null);
  }
  function clickAt(e) {
    const [x, y] = local(e);
    if (placing) {
      const at = skyAt(x, y);
      if (!at || Math.hypot(x - cam.x, y - cam.y) < R * cam.s * 1.25 || y < top.getBoundingClientRect().bottom - app.getBoundingClientRect().top) return;
      pending = at;
      setStarMsg("starThere");
      $("starForm").hidden = false; $("starRow").hidden = true; $("starWord").focus();
      return;
    }
    const s = starAt(x, y);
    if (s) return showTip(starText(s), ...starPos(s));
    if (mode === "title") { if (Math.hypot(x - cam.x, y - cam.y) < R * cam.s * 1.25) startLanding(); return; }
    const i = placeAt(x, y);
    if (i >= 0) { goTo(i, true); walked(); tip.hidden = true; return; }
    showTip(null);
  }
  let wheelAcc = 0, wheelLock = 0;
  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    if (mode !== "surface") { if (mode === "title" && e.deltaY > 20 && !placing) startLanding(); return; }
    const now = performance.now(); if (now < wheelLock) return;
    wheelAcc += Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if (Math.abs(wheelAcc) > 50) { goTo(focus() + Math.sign(wheelAcc)); walked(); wheelAcc = 0; wheelLock = now + 380; }
  }, { passive: false });
  document.addEventListener("keydown", (e) => {
    if (app.hidden || e.target.closest("input, textarea")) return;
    if (mode === "landing" || mode === "takeoff") {
      if (["Enter", " ", "Escape"].includes(e.key)) { mode === "landing" ? finishLanding() : finishTakeoff(); e.preventDefault(); }
      return;
    }
    if (mode === "title") {
      if (e.key === "Escape" && placing) stopPlacing();
      else if (["Enter", " ", "ArrowDown"].includes(e.key) && !e.target.closest("button, a") && !placing) { startLanding(); e.preventDefault(); }
      return;
    }
    if (e.key === "ArrowRight") { goTo(focus() + 1); walked(); e.preventDefault(); }
    else if (e.key === "ArrowLeft") { goTo(focus() - 1); walked(); e.preventDefault(); }
    else if (/^[1-8]$/.test(e.key)) { goTo(Number(e.key) - 1, true); walked(); }
    else if (e.key === "Escape") placing ? stopPlacing() : setView(false);
  });

  /* ---------- star placing ---------- */
  const starBtn = $("starBtn"), starbar = $("starbar");
  const FIELDS = { name: $("starName"), org: $("starOrg"), word: $("starWord") };
  starBtn.addEventListener("click", () => {
    placing = true; pending = null; canvas.classList.add("placing"); syncFar();
    setStarMsg("starTap");
    $("starRemove").hidden = !starMoved && !myLocal;
    $("starForm").hidden = true; $("starRow").hidden = false; starbar.hidden = false;
  });
  function stopPlacing() {
    placing = false; pending = null; canvas.classList.remove("placing"); starbar.hidden = true; syncFar();
    for (const el of Object.values(FIELDS)) { el.value = ""; el.removeAttribute("aria-invalid"); }
  }
  $("starCancel").addEventListener("click", stopPlacing);
  $("starCancel2").addEventListener("click", stopPlacing);
  $("starForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!pending) return;
    const entry = {};
    for (const [k, el] of Object.entries(FIELDS)) { entry[k] = el.value.replace(/\s+/g, " ").trim().slice(0, el.maxLength); el.removeAttribute("aria-invalid"); }
    const problem = check(entry);
    if (problem) {   // say which field and why, and let them fix it
      const [field, reason] = problem;
      setStarMsg(reason); FIELDS[field].setAttribute("aria-invalid", "true"); FIELDS[field].focus();
      return;
    }
    const s = { a: pending.a, h: pending.h, ...entry, lit: Date.now() };
    stopPlacing();
    if (!(await saveStar(s))) {
      myLocal = { ...s, mine: true };
      try { localStorage.setItem("shortplanet-star", JSON.stringify(s)); } catch {}
      flashLedger("litLocal");
    } else flashLedger("litShared");
    litAt = performance.now() / 1000;
  });
  $("starRemove").addEventListener("click", async () => {
    if (db && myId && starMoved) { try { await db.collection("stars").doc(myId).delete(); } catch { return setStarMsg("modFailed"); } }
    myLocal = null; starMoved = false; starBtn.textContent = t("star");
    try { localStorage.removeItem("shortplanet-star"); } catch {}
    stopPlacing(); flashLedger("removed");
  });

  // the ledger and star texts keep their keys so a language switch can redraw them
  let ledgerKey = ["looking"], flashKey = null, flashTimer = 0, starMsgKey = "starTap", starMoved = false;
  const showLedger = () => (ledger.textContent = $("titleLedger").textContent = flashKey ? t(flashKey) : t(...ledgerKey));
  function setLedger(...k) { ledgerKey = k; showLedger(); }
  function flashLedger(k) {
    flashKey = k; showLedger(); clearTimeout(flashTimer);
    flashTimer = setTimeout(() => { flashKey = null; showLedger(); }, 6000);
  }
  function setStarMsg(k) { starMsgKey = k; $("starMsg").textContent = t(k); }
  function markStarMoved() { starMoved = true; starBtn.textContent = t("moveStar"); }

  /* ---------- the checker ----------
     Every field goes through it before a star is saved, and again before any star's text is shown, so an
     entry written around the page still never appears. On the real site the same rules run on the server,
     with an AI model judging what lists cannot (relevance, insults in disguise). */
  const fold = (w) => w.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[0134578@$€!|]/g, (c) => ({ 0: "o", 1: "i", 3: "e", 4: "a", 5: "s", 7: "t", 8: "b", "@": "a", $: "s", "€": "e", "!": "i", "|": "i" }[c]));
  // matched inside words, so only stems that never occur in ordinary words
  const STEMS = ["fuck", "shit", "cunt", "bitch", "nigg", "fagg", "whore", "slut", "hitler", "wank",
    "connard", "connass", "salope", "encul", "bougnoul", "pedophil", "pedofil"];
  // matched as whole words: insults, crude or sexual words, and politics, in English and French
  const WORDS = new Set(["nazi", "nazis", "porn", "porno", "retard", "retarded", "batard", "batards", "negro", "pd", "fdp", "ntm", "tg", "kys", "stfu", "wtf", "pute", "putain", "nique", "niquer", "dick", "cock", "rape",
    "viol", "bite", "chatte", "couille", "couilles", "merde", "cul", "con", "conne", "abruti", "abrutie", "idiot", "idiote", "stupid",
    "dumb", "loser", "ugly", "moche", "nul", "nulle", "suck", "sucks", "crap", "sex", "sexy", "xxx", "nude", "nudes", "hentai",
    "trash", "poubelle", "caca", "cringe", "boring", "worst", "pire", "naze", "bouffon", "debile",
    "trump", "macron", "melenchon", "bardella", "zemmour", "lepen", "putin", "biden", "maga", "election", "elections", "vote", "votez"]);
  const FAMOUS = new Set(["elon", "musk", "trump", "macron", "obama", "biden", "putin", "zuckerberg", "bezos", "hitler", "staline",
    "stalin", "melenchon", "zemmour", "bardella", "lepen", "kardashian", "mbappe"]);
  const KEYBOARD = ["qwert", "asdf", "zxcv", "azert", "qsdf", "wxcv", "hjkl", "uiop", "sdfg", "dfgh"];
  const CONTACT = /https?:|www\.|\.(com|net|org|fr|io|gg|xyz|ru|me|ly|co|app|dev|tv)\b|@|\+?\d[\d .-]{6,}\d|\d{5,}/i;
  function unkind(v) {
    const f = fold(v), squashed = f.replace(/[^a-z]/g, "");
    return STEMS.some((x) => squashed.includes(x)) || f.split(/[^a-z]+/).some((x) => WORDS.has(x));
  }
  function gibberish(v) {
    const f = fold(v), letters = f.replace(/[^a-z]/g, "");
    return /(.)\1{3,}/.test(f)                                        // aaaa, !!!!
      || KEYBOARD.some((k) => letters.includes(k))                     // keyboard mashing
      || /[bcdfghjklmnpqrstvwxz]{6,}/.test(letters)                   // six consonants in a row
      || f.split(/[^a-z]+/).some((x) => x.length >= 6 && !/[aeiouy]/.test(x))
      || !/[\p{L}\p{Extended_Pictographic}]/u.test(v);                // nothing but symbols
  }
  // null when the entry can go in the sky, otherwise [field, reason]
  function check({ name = "", org = "", word = "" }) {
    for (const [field, v] of [["name", name], ["org", org], ["word", word]]) {
      if (!v) continue;
      if (CONTACT.test(v)) return [field, "noContact"];
      if (unkind(v) || /[<>{}[\]\\]/.test(v)) return [field, "notKind"];
      if (gibberish(v)) return [field, "unclear"];
    }
    if (name) {
      const parts = name.split(/[ -]+/).filter(Boolean);
      if (!/^[\p{L}' -]+$/u.test(name) || parts.length > 2 || parts.some((x) => FAMOUS.has(fold(x)))) return ["name", "notName"];
    }
    if (org && (!/\p{L}.*\p{L}/u.test(org) || org.split(" ").length > 6)) return ["org", "notOrg"];
    return null;
  }

  /* ---------- shared sky (db) ----------
     stars/<id>   each visitor's star and what they wrote; everyone reads, each visitor writes their own.
                  It shows as soon as it passes the checker: there is no queue.
     hidden/<id>  the owner's quiet veto for the rare miss; everyone reads, only the owner writes. It covers
                  the exact entry it was given for, so a visitor who rewrites theirs goes back through the checker. */
  let db = null, isOwner = false, hidden = {};
  function hashEntry(s) {   // FNV-1a over what the visitor wrote
    let h = 0x811c9dc5;
    for (const ch of [s.name, s.org, s.word].join("|")) { h ^= ch.codePointAt(0); h = Math.imul(h, 0x01000193); }
    return (h >>> 0).toString(16);
  }
  const isHidden = (s) => hidden[s.id]?.hash === hashEntry(s);
  const hasText = (s) => !!(s.name || s.org || s.word);
  function clean(id, d) {
    const n = (v) => Math.min(1, Math.max(0, Number(v) || 0)), str = (v, max) => (typeof v === "string" ? v.slice(0, max) : "");
    let a = Number(d?.a), h = Number(d?.h);
    if (!Number.isFinite(a) || !Number.isFinite(h)) { a = (n(d?.x) - .5) * 2.4; h = Math.max(.08, 1 - n(d?.y) * 1.15); }   // saved before stars had sky positions
    return { id, a: mod(a, Math.PI * 2), h: n(h), name: str(d?.name, 24), org: str(d?.org, 40), word: str(d?.word, 32), lit: Number(d?.lit) || 0 };
  }
  async function saveStar(s) {
    if (!db || !myId) return false;
    try { await db.collection("stars").doc(myId).set({ a: s.a, h: s.h, name: s.name, org: s.org, word: s.word, lit: s.lit }); markStarMoved(); return true; }
    catch { return false; }
  }
  function countText(n) {
    return !n ? ["none"] : n === 1 ? ["one"] : ["many", n];
  }
  async function initSky() {
    try { const s = JSON.parse(localStorage.getItem("shortplanet-star") || "null"); if (s) myLocal = { ...clean("local", s), mine: true }; } catch {}
    const c = window.claude;
    if (!c?.use) { setLedger(myLocal ? "localSky" : "beforeLeave"); return; }
    const [d, user] = await Promise.all([c.use("db").catch(() => null), c.use("user").catch(() => null)]);
    db = d;
    if (!db) { setLedger(myLocal ? "localSky" : "beforeLeave"); return; }
    myId = user ? await user.id().catch(() => null) : null;
    isOwner = user ? await user.isOwner().catch(() => false) : false;
    $("modBtn").hidden = !isOwner;
    const slow = setTimeout(() => setLedger("slow"), 10000);
    db.collection("hidden").limit(500).onSnapshot((snap) => {
      hidden = Object.fromEntries(snap.docs.filter((x) => x.exists).map((x) => [x.id, x.data()]));
      renderMod();
    }, () => {});
    db.collection("stars").limit(500).onSnapshot((snap) => {
      if (!snap.metadata.fromCache) clearTimeout(slow);
      stars = snap.docs.filter((x) => x.exists).map((x) => clean(x.id, x.data()));
      if (myId && stars.some((s) => s.id === myId)) { myLocal = null; markStarMoved(); }
      setLedger(...countText(stars.length));
      renderMod();
    }, () => { clearTimeout(slow); setLedger("unreachable"); });
  }

  /* ---------- who lit a star (owner only) ----------
     Not a queue: everything here is already in the sky. It is a guestbook, with a Hide for the rare miss. */
  const modDialog = $("mod"), modList = $("modList");
  function renderMod() {
    if (!isOwner) return;
    const rows = stars.filter(hasText).map((s) => ({ ...s, st: check(s) ? "caught" : isHidden(s) ? "hidden" : "shown" }));
    const day = (at) => (at ? new Date(at).toLocaleDateString(lang, { day: "numeric", month: "short", year: "numeric" }) : "");
    modList.innerHTML = ["shown", "hidden"].map((st) => {
      const list = rows.filter((r) => (st === "shown" ? r.st === "shown" : r.st !== "shown")).sort((a, b) => b.lit - a.lit);
      if (!list.length) return st === "shown" ? `<p class="mod-empty">${t("modNone")}</p>` : "";
      return `<section><span class="label">${t("mod_" + st)} · ${list.length}</span><ul>${list.map((r) => `<li data-id="${esc(r.id)}">
        <span class="mod-word">${esc(entryText(r))}<small>${day(r.lit)}${r.st === "caught" ? " · " + t("modCaught") : ""}</small></span>
        <span class="mod-actions">${r.st === "shown" ? `<button type="button" data-mod="hide">${t("modHide")}</button>` : ""}${r.st === "hidden" ? `<button type="button" data-mod="show">${t("modShowAgain")}</button>` : ""}<button type="button" data-mod="remove">${t("modRemove")}</button></span>
      </li>`).join("")}</ul></section>`;
    }).join("");
  }
  modList.addEventListener("click", async (e) => {
    const b = e.target.closest("[data-mod]");
    if (!b || !db) return;
    const id = b.closest("li").dataset.id, s = stars.find((x) => x.id === id), act = b.dataset.mod;
    if (!s) return;
    if (act === "remove" && !b.dataset.sure) { b.dataset.sure = "1"; b.textContent = t("modSure"); return; }   // two clicks to remove
    b.disabled = true;
    try {
      if (act === "hide") await db.collection("hidden").doc(id).set({ hash: hashEntry(s), at: Date.now() });
      else if (act === "show") await db.collection("hidden").doc(id).delete();
      else { await db.collection("stars").doc(id).delete(); await db.collection("hidden").doc(id).delete(); }
    } catch { b.disabled = false; b.textContent = t("modFailed"); }
  });
  $("modBtn").addEventListener("click", () => { renderMod(); modDialog.showModal(); });
  $("modClose").addEventListener("click", () => modDialog.close());
  modDialog.addEventListener("click", (e) => { if (e.target === modDialog) modDialog.close(); });   // click outside closes

  /* ---------- language switch ---------- */
  function langSwitch() {
    return `<div class="lang" role="group" aria-label="Language · Langue">${["en", "fr"].map((l) =>
      `<button type="button" data-lang="${l}" lang="${l}" aria-pressed="${l === lang}">${l.toUpperCase()}</button>`).join("")}</div>`;
  }
  function setLang(l) {
    const refocus = plain.contains(document.activeElement);
    lang = l; PL = PLACES.map(loc);
    try { localStorage.setItem("shortplanet-lang", l); } catch {}
    document.documentElement.lang = l;
    document.querySelectorAll("[data-i18n]").forEach((el) => (el.textContent = t(el.dataset.i18n)));
    document.querySelectorAll("[data-i18n-ph]").forEach((el) => (el.placeholder = t(el.dataset.i18nPh)));
    document.querySelectorAll("[data-i18n-aria]").forEach((el) => el.setAttribute("aria-label", t(el.dataset.i18nAria)));
    document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === l)));
    nameDots(); showLedger(); setStarMsg(starMsgKey); setView(zView);
    starBtn.textContent = t(starMoved ? "moveStar" : "star");
    shown = -1; renderCard(focus()); renderMod();
    if (!plain.hidden) { renderPlain(); if (refocus) plain.querySelector(`[data-lang="${l}"]`)?.focus(); }
    layout();   // button widths change with the language, and so can the header height
  }

  /* ---------- start ---------- */
  setLang(lang);
  // the front page comes first; #surface or #plain skip it
  if (location.hash === "#surface" || location.hash === "#plain") {
    app.classList.add("no-fade"); z = 0; finishLanding();
    requestAnimationFrame(() => requestAnimationFrame(() => app.classList.remove("no-fade")));
  }
  if (location.hash === "#plain") setPlain(true);
  layout();
  initSky();
  requestAnimationFrame(frame);
})();
</script>
